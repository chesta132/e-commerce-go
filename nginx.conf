events {}

http {
    upstream user_service {
        server go-user:8080;
    }

    server {
        listen 80;

        location /user {
            proxy_pass http://user_service/user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /auth {
            proxy_pass http://user_service/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        error_page 404 = /404;
        location /404 {
            default_type application/json;
            return 404 '{"meta":{"status":"ERROR"},"data":{"code":"NOT_FOUND","message":"endpoint: $request_uri not found"}}';
        }
    }
}
