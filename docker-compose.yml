services:
  # User Service
  postgres-user:
    image: postgres:15-alpine
    container_name: postgres-user
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=user_db
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  go-user:
    build: ./user-service
    container_name: go-user
    volumes:
      - ~/go/pkg/mod:/go/pkg/mod
    ports:
      - "8080:8080"
    depends_on:
      postgres-user:
        condition: service_healthy
    environment:
      - DB_HOST=postgres-user
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=user_db
      - PORT=8080
      - SERVICE=user-service
    env_file:
      - .env
      - user-service/.env
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-user-data:
    driver: local
